services:
  db:
    image: postgres:17
    container_name: citas-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - citas-data:/var/lib/postgresql/data
    networks:
      - citas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: citas-api
    container_name: citas-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@citas-db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    networks:
      - citas-net
    depends_on:
      db:
        condition: service_healthy

networks:
  citas-net:

volumes:
  citas-data:
